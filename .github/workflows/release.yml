name: Windows release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Build and test the Windows applications
        shell: cmd
        run: call tests\check.cmd

      - name: Package cabinet files
        shell: pwsh
        run: Compress-Archive -LiteralPath bin/ArcadePicker.exe, bin/ArcadeSetup.exe, README.md, LICENSE -DestinationPath LinusArcade.zip

      - name: Publish release with the cabinet ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:RELEASE_TAG" LinusArcade.zip --verify-tag --title "Linus Arcade $env:RELEASE_TAG" --generate-notes
